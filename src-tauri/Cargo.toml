[package]
name = "Jan"
version = "0.9.0"
description = "Use offline LLMs with your own data. Run open source models like Llama2 or Falcon on your internal computers/servers."
authors = ["Jan <service@jan.ai>"]
license = "Apache-2.0"
repository = "https://github.com/Jozkah/flint"
edition = "2021"
# 1.85 is the floor: `genai` (the OpenAI upstream client) is edition 2024.
# Below that the previous floor was 1.82, for `Option::is_none_or` in agent/loop.rs.
rust-version = "1.88"
resolver = "2"
default-run = "Flint-Desktop"
# Every binary this package ships is declared explicitly below. Cargo otherwise
# auto-discovers each file in `src/bin/` as a binary of its own, carrying none
# of the `required-features` a declared target would have -- so a feature-gated
# helper dropped in there is built unconditionally and fails on the modules it
# is gated behind. Declaring the targets is the contract; this keeps it honest.
autobins = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Flint-Desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "flint"
path = "src/bin/flint.rs"
required-features = ["cli"]

[[test]]
name = "stream_json_init"
path = "tests/stream_json_init.rs"
required-features = ["cli"]

[[test]]
name = "stream_json_host_tools"
path = "tests/stream_json_host_tools.rs"
required-features = ["cli"]

[[test]]
name = "agent_rpc"
path = "tests/agent_rpc.rs"
required-features = ["cli"]

[[test]]
name = "sdk_examples"
path = "tests/sdk_examples.rs"
required-features = ["cli"]

[[example]]
name = "cowork-smoke"
path = "examples/cowork_smoke.rs"
required-features = ["cowork-smoke"]

[features]
default = [
    "tauri/wry",
    "tauri/common-controls-v6",
    "tauri/x11",
    "tauri/protocol-asset",
    "tauri/macos-private-api",
    "tauri/tray-icon",
    "tauri/test",
    "tauri/custom-protocol",
    "desktop",
]
cowork-smoke = ["desktop"]
hardware = ["tauri-plugin-hardware/tauri"]
deep-link = ["dep:tauri-plugin-deep-link"]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
desktop = [
    "deep-link",
    "hardware",
    "tauri-app",
]
tauri-app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-http",
    "dep:tauri-plugin-llamacpp",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-os",
    "dep:tauri-plugin-rag",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-store",
    "dep:tauri-plugin-mlx",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-dialog",
    "dep:fix-path-env",
    "dep:rfd",
    "dep:gtk",
    "dep:zbus",
    "tauri-plugin-vector-db/tauri",
    "tauri-plugin-websearch/tauri",
    "tauri-plugin-agent-tools/tauri",
]
mobile = [
    "tauri/protocol-asset",
    "tauri/test",
    "tauri/wry",
    "dep:sqlx",
    "tauri-app",
]
test-tauri = [
    "tauri-app",
    "tauri/wry",
    "tauri/x11",
    "tauri/protocol-asset",
    "tauri/macos-private-api",
    "tauri/tray-icon",
    "tauri/test",
    "deep-link",
    "hardware",
]
cli = ["dep:env_logger", "dep:indicatif", "dep:console", "dep:ratatui", "dep:unicode-width", "dep:pulldown-cmark", "dep:syntect", "dep:comfy-table", "dep:arboard", "dep:png"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [], optional = true }
serde_json = "1.0"

[dependencies]
dirs = "6.0.0"
schemars = "1"
async-trait = "0.1"
env = "1.0.1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", optional = true }
flate2 = "1.0"
form_urlencoded = "1.2"
futures-util = "0.3.31"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-stream = "0.1"
tokio-util = "0.7.14"
jan-utils = { path = "./utils" }
jan-process = { path = "./process" }
libloading = "0.8.7"
log = "0.4"
oauth2 = "5.0"
rand = "0.8"
rmcp = { version = "3.2.0", features = [
    "auth",
    "client",
    "server",
    "transport-io",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-child-process",
    "tower",
    "reqwest",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9.34"
toml = "0.8"
toml_edit = "0.23"
sha2 = "0.10"
unicode-normalization = "0.1"
tar = "0.4"
zip = "0.6"
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4", optional = true }
tauri-plugin-hardware = { path = "./plugins/tauri-plugin-hardware", default-features = false }
tauri-plugin-llamacpp = { path = "./plugins/tauri-plugin-llamacpp", optional = true }
tauri-plugin-vector-db = { path = "./plugins/tauri-plugin-vector-db", default-features = false }
tauri-plugin-rag = { path = "./plugins/tauri-plugin-rag", optional = true }
tauri-plugin-websearch = { path = "./plugins/tauri-plugin-websearch", default-features = false }
tauri-plugin-agent-tools = { path = "./plugins/tauri-plugin-agent-tools", default-features = false }
tauri-plugin-http = { version = "2", optional = true, default-features = false, features = [
  "native-tls",
  "http2",
  "charset",
  "macos-system-configuration",
  "cookies",
  "unsafe-headers",
] }
tauri-plugin-log = { version = "2.0.0-rc", optional = true }
tauri-plugin-opener = { version = "2.2.7", optional = true }
tauri-plugin-os = { version = "2.2.1", optional = true }
tauri-plugin-shell = { version = "2.2.0", optional = true }
tauri-plugin-store = { version = "2", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"], optional = true }
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
url = "2.5"
uuid = { version = "1.7", features = ["v4"] }
tempfile = "3.20.0"
rfd = { version = "0.15.4", optional = true, default-features = false, features = [
  "tokio",
  "xdg-portal",
  "common-controls-v6",
] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
hostname = "0.4"
base64 = "0.22"
glob = "0.3"
regex = "1"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11", optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.15", optional = true }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "async-secret-service",
    "async-io",
    "crypto-rust",
] }
aes-gcm = "0.10"
machine-uid = "0.5"
ratatui = { version = "0.30", optional = true, features = ["unstable-rendered-line-info"] }
unicode-width = { version = "0.2", optional = true }
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", optional = true, default-features = false }
syntect = { version = "5.3", optional = true, default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
comfy-table = { version = "7.2", default-features = false, optional = true }
arboard = { version = "3", optional = true, features = ["wayland-data-control"] }
png = { version = "0.17", optional = true }

[dependencies.tauri]
version = "2.8.5"
optional = true
default-features = false
features = ["protocol-asset", "macos-private-api", "test", "unstable"]

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal", "process", "resource"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }
gtk = { version = "0.18", optional = true }

[target.'cfg(windows)'.dependencies]
libc = "0.2.172"
webview2-com = "0.38.2"
windows-core = "0.61"
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-mlx = { path = "./plugins/tauri-plugin-mlx", optional = true }
security-framework = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking", "stream", "native-tls"] }
genai = { version = "=0.7.0-beta.19", default-features = false, features = ["native-tls"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "native-tls"] }
once_cell = "1.18"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking", "stream", "rustls-tls"], default-features = false }
genai = { version = "=0.7.0-beta.19", default-features = false, features = ["rustls-tls"] }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2", "rustls"] }
tauri-plugin-dialog = { version = "2.2.1", default-features = false, optional = true }
tauri-plugin-http = { version = "2", default-features = false, optional = true }
tauri-plugin-log = { version = "2.0.0-rc", default-features = false, optional = true }
tauri-plugin-opener = { version = "2.2.7", default-features = false, optional = true }
tauri-plugin-os = { version = "2.2.1", default-features = false, optional = true }
tauri-plugin-shell = { version = "2.2.0", default-features = false, optional = true }
tauri-plugin-store = { version = "2", default-features = false, optional = true }

[profile.release]
opt-level = "z"
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "unwind"
overflow-checks = false
debug = false
debug-assertions = false
incremental = false
rpath = false
