[package]
name = "jan-process"
version = "0.1.0"
edition = "2021"
description = "One place that decides whether a child process gets a console window: background helpers stay hidden, user terminals stay visible"

[dependencies]
tokio = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread", "time", "io-util"] }
