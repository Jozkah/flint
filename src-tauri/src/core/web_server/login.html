<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Flint sign in</title>
<style>
  /* The app's own tokens (see the start-up screen in web-app/index.html), so
     this page reads as part of the same product. No script runs here. */
  :root {
    --bg: #f8f8f8; --card: #ffffff; --muted: #f6f6f6; --fg: #1f2937;
    --sub: #6b7280; --line: #e5e7eb; --ring: #37475d;
    --accent: #1f2937; --accent-fg: #ffffff; --accent-hover: #37475d;
    --danger: #b42318; --danger-bg: #fef3f2; --danger-line: #fecdca;
    --lift: 0 2px 3px -1px rgba(0,0,0,.1), 0 0 0 1px rgba(25,28,33,.08), 0 12px 32px -12px rgba(0,0,0,.18);
    --mark-filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0b0d; --card: #131519; --muted: #0f1114; --fg: #e6e8eb;
      --sub: #8a909a; --line: #23262c; --ring: #d9dde3;
      --accent: #e6e8eb; --accent-fg: #0a0b0d; --accent-hover: #ffffff;
      --danger: #fda29b; --danger-bg: #2a1210; --danger-line: #5c211c;
      --lift: 0 2px 3px -1px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.09), 0 12px 32px -12px rgba(0,0,0,.6);
      --mark-filter: drop-shadow(0 0 1px rgba(255,255,255,.35)) brightness(1.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 24px 16px;
  }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .frame { padding: 5px; border-radius: 22px; background: var(--muted); box-shadow: inset 0 0 0 .8px var(--line); }
  .tile {
    display: grid; place-items: center; width: 88px; height: 88px; border-radius: 18px;
    background: var(--card); box-shadow: var(--lift);
  }
  .tile img { width: 54px; height: 54px; image-rendering: pixelated; filter: var(--mark-filter); }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; text-align: center; }
  .lead { margin: 6px 0 0; color: var(--sub); text-align: center; }
  form {
    width: 100%; display: flex; flex-direction: column; gap: 14px; padding: 20px;
    background: var(--card); border-radius: 14px; box-shadow: var(--lift);
  }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
  input {
    width: 100%; height: 40px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: inherit; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em;
  }
  input::placeholder { color: var(--sub); }
  input:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
  button {
    height: 40px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600;
  }
  button:hover { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .notice {
    margin: 0; padding: 10px 12px; border-radius: 10px; font-size: 13px;
    color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger-line);
  }
  .hint { margin: 0; color: var(--sub); font-size: 12px; text-align: center; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
