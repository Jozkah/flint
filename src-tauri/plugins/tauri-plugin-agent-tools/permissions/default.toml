[default]
description = "Default permissions for the agent tools plugin: skill/memory management plus built-in tool execution"
permissions = [
    "allow-workspace-path",
    "allow-thread-workspace-path",
    "allow-thread-workspace-delete",
    "allow-thread-workspace-sweep",
    "allow-session-workspace-path",
    "allow-session-workspace-delete",
    "allow-session-workspace-sweep",
    "allow-direct-edit-capability",
    "allow-direct-edit-authorize",
    "allow-direct-edit-revoke",
    "allow-direct-edit-revoke-session",
    "allow-secrets-redact",
    "allow-skill-list",
    "allow-skill-read",
    "allow-skill-write",
    "allow-skill-delete",
    "allow-memory-list",
    "allow-memory-read",
    "allow-memory-write",
    "allow-memory-delete",
    # Canonical memory records: the management surface behind Settings > Memory.
    # Reading is bounded and scope-checked in the backend, and every write goes
    # through the same validation the agent's own path does.
    "allow-memory-records-list",
    "allow-memory-record-get",
    "allow-memory-record-edit",
    "allow-memory-record-propose",
    "allow-memory-record-propose-inferred",
    "allow-memory-proposals-list",
    "allow-memory-proposal-resolve",
    "allow-memory-record-commit",
    "allow-memory-record-forget",
    "allow-memory-record-restore",
    "allow-memory-record-pin",
    "allow-memory-record-set-expiration",
    "allow-memory-record-move-scope",
    "allow-memory-storage-summary",
    "allow-memory-settings-get",
    "allow-memory-settings-update",
    "allow-memory-retrieve",
    "allow-tool-schemas",
    "allow-sandbox-status",
    "allow-environment-readiness",
    "allow-environment-readiness-retry",
    "allow-advertised-tool-schemas",
    "allow-execute-tool",
    "allow-execute-tool-streaming",
    "allow-project-list-dir",
    "allow-project-read-file",
    "allow-bash-jobs-list",
    "allow-bash-job-kill",
    # Read-only view of the permission decision log for Settings > Permissions.
    # Bounded, and redacted before it is returned.
    "allow-permission-audit-recent",
    # Cross-session messaging (docs/SESSION_MESSAGING.md). The backend enforces
    # same-project, rate and reply limits; none of these touch permissions.
    "allow-mailbox-session-register",
    "allow-mailbox-session-status",
    "allow-mailbox-session-heartbeat",
    "allow-mailbox-session-remove",
    "allow-mailbox-take-for-delivery",
    "allow-mailbox-pending",
    "allow-mailbox-mark-read",
    "allow-mailbox-reply",
    "allow-mailbox-list-sessions",
]
