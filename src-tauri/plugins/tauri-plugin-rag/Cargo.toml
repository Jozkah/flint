[package]
name = "tauri-plugin-rag"
version = "0.1.0"
authors = ["Jan <service@jan.ai>"]
description = "Tauri plugin for RAG utilities (document parsing, types)"
license = "Apache-2.0"
repository = "https://github.com/Jozkah/flint"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-rag"

[features]
default = ["tauri"]
# The Tauri command/plugin surface. Disabled by the headless CLI and
# `flint serve`, which call `parser` directly and link no GUI crate.
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2.8.5", default-features = false, optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
pdf-extract = "0.12"
# Same lopdf pdf-extract already links; used directly as a lenient fallback.
lopdf = { version = "0.42", default-features = false }
zip = "0.6"
# 0.41+: earlier versions check duplicate attributes in O(n^2) (RUSTSEC-2026-0194).
quick-xml = { version = "0.41", features = ["serialize"] }
csv = "1.3"
# 0.36 is the first calamine on quick-xml 0.41 (RUSTSEC-2026-0194).
calamine = "0.36"
html2text = "0.11"
chardetng = "0.1"
encoding_rs = "0.8"
infer = "0.15"

[build-dependencies]
tauri-plugin = { version = "2.3.1", features = ["build"] }
