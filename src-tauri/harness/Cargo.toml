[package]
name = "jan-agent-harness"
version = "0.8.4"
description = "Foundation models for the Jan coding-agent harness: run identity, the canonical event stream, the error taxonomy, the persisted state schema and shared test fixtures"
authors = ["Jan <service@jan.ai>"]
license = "MIT"
repository = "https://github.com/janhq/jan"
edition = "2021"
# Matches the app crate's floor so this can be linked from either surface.
rust-version = "1.85"

# Deliberately dependency-light: the desktop app, the headless CLI and the test
# suites all link this, so it must not pull in Tauri, a GUI stack or an async
# runtime. Keeping it small is also what keeps `cargo test -p jan-agent-harness`
# fast enough to run on every change.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
