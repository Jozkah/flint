<!doctype html>
<html lang="en" class="preload">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="32x32"
      href="/images/flint-logo.svg"
    />
    
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="16x16"
      href="/images/flint-logo.svg"
    />
    <link rel="apple-touch-icon" href="/images/flint-logo.svg" />
    <link
      rel="preload"
      as="image"
      href="/images/flint-logo.svg"
      fetchpriority="high"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
    />
    <title>Flint</title>
    <style>
      /* Inlined so it applies on first paint (external CSS is injected late). */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #f8f8f8;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.3s ease-in-out;
      }
      .dark #initial-loader {
        background: #0a0b0d;
      }
      #initial-loader img {
        width: 5rem;
        height: 5rem;
        /* Sprite animates itself (strike + sparks). */
      }
      @keyframes wave {
        0%,
        100% {
          transform: rotate(0deg);
        }
        10%,
        30% {
          transform: rotate(14deg);
        }
        20% {
          transform: rotate(-8deg);
        }
        40%,
        60% {
          transform: rotate(14deg);
        }
        50% {
          transform: rotate(-8deg);
        }
        70% {
          transform: rotate(0deg);
        }
      }
      #initial-loader-caption {
        margin: 0;
        text-align: center;
        line-height: 1;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          sans-serif;
        font-size: 0.875rem;
        font-weight: 400;
        color: #6b7280;
        opacity: 0;
        /* Delayed so fast starts never flash the caption. */
        animation: caption-fade-in 0.3s ease-in-out 1s forwards;
      }
      .dark #initial-loader-caption {
        color: #8a909a;
      }
      @keyframes caption-fade-in {
        to {
          opacity: 1;
        }
      }
      .loaded #initial-loader {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script>
      // Apply the theme, accent, font size and motion setting before first
      // paint. The settings stores hydrate from the backend after boot, so
      // they mirror their resolved values into localStorage 'flint-boot'
      // (lib/bootAppearance.ts) for this script; keep the two in step.
      // ThemeProvider re-resolves the real theme once React mounts.
      (function () {
        var d = document.documentElement
        var b = null
        try {
          b = JSON.parse(localStorage.getItem('flint-boot') || 'null')
        } catch (_) {}
        var t = (b && b.theme) || 'auto'
        var dark =
          t === 'dark' ||
          (t === 'auto' &&
            (window.matchMedia
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : !!(b && b.dark)))
        if (dark) d.classList.add('dark')
        d.style.colorScheme = dark ? 'dark' : 'light'
        d.style.background = dark ? '#0a0b0d' : '#f8f8f8'
        if (!b) return
        var vars = b.vars && b.vars[dark ? 'dark' : 'light']
        if (vars)
          for (var k in vars)
            if (Object.prototype.hasOwnProperty.call(vars, k))
              d.style.setProperty(k, vars[k])
        if (b.fontSize) d.style.setProperty('--font-size-base', b.fontSize)
        if (b.reduceMotion) d.classList.add('reduce-motion')
      })()
    </script>
    <script>
      // Suppress the WebView2 "Reload site?" beforeunload confirmation.
      // This desktop app has no page-level unsaved-form state worth guarding;
      // the dialog only interrupts HMR reloads and extension operations.
      Object.defineProperty(window, 'onbeforeunload', {
        get: function () { return null },
        set: function () {},
      })
      window.addEventListener('beforeunload', function (e) {
        e.stopImmediatePropagation()
        delete e.returnValue
      }, true)
    </script>
  </head>
  <body>
    <div id="initial-loader" data-tauri-drag-region>
      <img src="/images/flint-steel-loader.svg" alt="Flint Logo" data-tauri-drag-region />
      <p id="initial-loader-caption" data-tauri-drag-region>Booting up Flint…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
