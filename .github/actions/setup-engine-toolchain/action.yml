name: Setup engine toolchain
description: >
  Selects a JAN_ENGINE_VARIANT and asserts the runner can build it. The engine
  jobs run on self-hosted runners whose images carry cmake, ccache and the
  vendor toolkits, so this installs nothing for them -- it points ccache at the
  runner's persistent cache and fails fast when the image cannot produce the
  variant it was handed. The one exception is the Vulkan SDK, which the
  GitHub-hosted images the desktop builds default to do not carry.

inputs:
  variant:
    description: >
      JAN_ENGINE_VARIANT to build: a `-` joined backend list, e.g. vulkan,
      cuda13-vulkan, rocm-vulkan, metal or cpu.
    required: true
  ccache-max:
    description: >
      ccache size limit. 25G rather than the 5G default because CUDA objects are
      large and a smaller cache thrashes instead of rolling over.
    required: false
    default: '25G'
  toolset:
    description: >
      MSVC toolset version for the developer environment nvcc builds in (for
      example 14.44). Empty uses the image's default toolset. Only the CUDA
      pack workflow, which installs 14.44 itself, sets it.
    required: false
    default: ''

  vulkan-version:
    description: >
      LunarG Vulkan SDK version the Windows installer is downloaded at. Bump it
      together with vulkan-sdk-sha256-windows.
    required: false
    default: '1.4.363.0'
  vulkan-sdk-sha256-windows:
    description: SHA-256 of that version's vulkan_sdk.exe, checked before it runs.
    required: false
    default: '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
  vulkan-apt-version:
    description: >
      LunarG apt release the Linux runners install (the repository's newest is
      1.4.313). Resolved to the exact vulkan-sdk package through apt-cache.
    required: false
    default: '1.4.313'

runs:
  using: composite
  steps:
    - name: Select the engine variant
      shell: bash
      run: echo "JAN_ENGINE_VARIANT=${{ inputs.variant }}" >> "$GITHUB_ENV"

    # Outside the workspace, which is re-cloned per run. NOHASHDIR because cmake
    # runs under cargo's hashed OUT_DIR, which would otherwise key every object.
    - name: Point ccache at the runner's persistent cache
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          echo "CCACHE_DIR=${LOCALAPPDATA}\\ccache" >> "$GITHUB_ENV"
        else
          echo "CCACHE_DIR=${HOME}/.ccache" >> "$GITHUB_ENV"
        fi
        echo "CCACHE_MAXSIZE=${{ inputs.ccache-max }}" >> "$GITHUB_ENV"
        echo "CCACHE_NOHASHDIR=1" >> "$GITHUB_ENV"

    # GitHub-hosted images have no ccache and no persistent disk.
    - name: Install ccache
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then
          echo "engine toolchain: ccache already on the image"
          exit 0
        fi
        case "$RUNNER_OS" in
        Linux)   sudo apt-get update && sudo apt-get install -y ccache ;;
        macOS)   brew install ccache ;;
        Windows) choco install ccache -y --no-progress ;;
        esac

    # build.rs holds the llama.cpp pin and cmake flags; the sha suffix makes
    # every run save, since actions/cache writes only on an exact-key miss.
    - name: Restore the ccache directory
      if: runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-${{ inputs.variant }}-${{ hashFiles('src-tauri/plugins/tauri-plugin-llamacpp/build.rs') }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ inputs.variant }}-${{ hashFiles('src-tauri/plugins/tauri-plugin-llamacpp/build.rs') }}-
          ccache-${{ runner.os }}-${{ inputs.variant }}-

    # No GitHub-hosted image ships a Vulkan shader compiler, and the desktop
    # templates default to the vulkan variant on one. Guarded on glslc rather
    # than on the runner label so a self-hosted image that carries the SDK does
    # no apt or installer work at all.
    - name: Provision the Vulkan SDK
      if: contains(format('-{0}-', inputs.variant), '-vulkan-')
      shell: bash
      run: |
        if command -v glslc >/dev/null 2>&1; then
          echo "engine toolchain: glslc already on the image"
          exit 0
        fi
        case "$RUNNER_OS" in
        Linux)
          # LunarG rather than the distro packages: jammy ships Vulkan headers
          # 1.3.204, older than the extensions ggml-vulkan compiles against.
          # The apt repository stops at 1.4.313, so Linux pins that release.
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          keyring=/usr/share/keyrings/lunarg-vulkan.gpg
          wget -qO "$RUNNER_TEMP/lunarg-key.asc" \
            https://packages.lunarg.com/lunarg-signing-key-pub.asc
          fingerprints=$(gpg --show-keys --with-colons "$RUNNER_TEMP/lunarg-key.asc" \
            | awk -F: '$1 == "fpr" {print $10}')
          echo "$fingerprints" | grep -qx '03F5D621A3710FA95A93D89BAA8452080E383F7E' || {
            echo "error: LunarG signing key fingerprint changed: $fingerprints" >&2
            exit 1
          }
          sudo gpg --dearmor --yes -o "$keyring" "$RUNNER_TEMP/lunarg-key.asc"
          ver="${{ inputs.vulkan-apt-version }}"
          wget -qO "$RUNNER_TEMP/lunarg.list" \
            "https://packages.lunarg.com/vulkan/$ver/lunarg-vulkan-$ver-$codename.list"
          sed "s#^deb #deb [signed-by=$keyring] #" "$RUNNER_TEMP/lunarg.list" \
            | sudo tee "/etc/apt/sources.list.d/lunarg-vulkan-$codename.list" >/dev/null
          sudo apt-get update
          pkg=$(apt-cache madison vulkan-sdk | awk -v v="$ver." 'index($3, v) == 1 {print $3; exit}')
          if [ -z "$pkg" ]; then
            echo "error: vulkan-sdk $ver is not in the LunarG repository" >&2
            exit 1
          fi
          sudo apt-get install -y "vulkan-sdk=$pkg"
          ;;
        Windows)
          # A persistent runner keeps the last run's install, and the installer
          # refuses to install over it.
          if [ -x /c/VulkanSDK/Bin/glslc.exe ]; then
            echo "engine toolchain: reusing the Vulkan SDK in C:\VulkanSDK"
          else
            ver="${{ inputs.vulkan-version }}"
            curl -fL -o "$RUNNER_TEMP/vulkan-sdk.exe" \
              "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe"
            # Verified before it is executed. To bump: change vulkan-version,
            # then take the new hash from
            # https://vulkan.lunarg.com/sdk/sha/<version>/windows/vulkan_sdk.exe.txt
            # and confirm it against your own download.
            echo "${{ inputs.vulkan-sdk-sha256-windows }}  $RUNNER_TEMP/vulkan-sdk.exe" \
              | sha256sum -c -
            "$RUNNER_TEMP/vulkan-sdk.exe" --root 'C:\VulkanSDK' \
              --accept-licenses --default-answer --confirm-command install
          fi
          echo 'VULKAN_SDK=C:\VulkanSDK' >> "$GITHUB_ENV"
          echo 'C:\VulkanSDK\Bin' >> "$GITHUB_PATH"
          ;;
        *)
          echo "error: no Vulkan SDK provisioning for $RUNNER_OS" >&2
          exit 1
          ;;
        esac

    # Windows builds the engine the way upstream llama.cpp builds this exact
    # configuration: Ninja plus its own clang toolchain file. No developer
    # environment is set up for it -- clang locates the MSVC headers and
    # libraries itself, which an earlier run demonstrated by compiling all of
    # ggml without one. The image carries LLVM; ninja is not dependable.
    - name: Provision the Windows engine toolchain
      if: runner.os == 'Windows'
      shell: bash
      run: |
        if command -v ninja >/dev/null 2>&1; then
          echo "engine toolchain: ninja already on the image"
        else
          choco install ninja -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> "$GITHUB_PATH"
        fi
        if command -v clang >/dev/null 2>&1; then
          echo "engine toolchain: clang already on the image"
        elif [ -x "/c/Program Files/LLVM/bin/clang.exe" ]; then
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
        else
          choco install llvm -y --no-progress
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
        fi


    # nvcc on Windows accepts only cl as its host compiler and finds it on PATH.
    - name: Enter the MSVC developer environment for nvcc
      if: runner.os == 'Windows' && contains(inputs.variant, 'cuda')
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        # MSVC 14.51 (VS 2026) crashes nvcc 13's cudafe++; the CUDA pack
        # workflow installs the 14.44 toolset and passes it in. Empty means
        # the image's default, which is what every other CUDA build wants.
        toolset: ${{ inputs.toolset }}

    # Inside a VS developer environment rustc takes link.exe from PATH, and make
    # runs its recipes through Git's sh.exe, whose MSYS runtime prepends its own
    # usr/bin -- where GNU coreutils `link` lives. Pin the linker by full path.
    - name: Pin cargo's linker to MSVC link.exe
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not $env:VCToolsInstallDir) { Write-Host "no VS developer environment; rustc locates link.exe itself"; exit 0 }
        $link = Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'
        if (-not (Test-Path $link)) { throw "link.exe not found at $link" }
        Add-Content $env:GITHUB_ENV "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$link"

    # Asserts the image, not the steps above: a mis-provisioned runner fails
    # here in seconds instead of five minutes into `make build`.
    # Stats zeroed so the post-build report covers this build only.
    - name: Verify the toolchain
      shell: bash
      run: |
        if command -v ccache >/dev/null 2>&1; then ccache -z; fi
        make check-engine-toolchain
