name: Linter & Test
on:
  workflow_dispatch:
  # PRs to main run the Ubuntu job only (script tests, locale parity, action
  # pins, make test-ci, check-cli). macOS and Windows run on the push to main
  # and on manual dispatch, so a PR does not fan out into three full builds.
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'

concurrency:
  group: linter-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-on-macos:
    runs-on: 'macos-latest'
    timeout-minutes: 90
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Getting the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installing node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/jan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Linter and test
        run: |
          make test-ci
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  test-on-windows:
    # Ran only on push, which this manual-dispatch workflow no longer has, and
    # needs self-hosted antivirus runners; disabled explicitly (#56).
    # test-on-windows-pr covers Windows on dispatch.
    if: false
    strategy:
      fail-fast: false
      matrix:
        antivirus-tools: ['mcafee', 'bit-defender']
    runs-on: windows-desktop-${{ matrix.antivirus-tools }}
    steps:
      - name: Getting the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installing node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # Clean cache, continue on error
      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\jan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version

      - name: Linter and test
        shell: powershell
        run: |
          make test

  test-on-windows-pr:
    # windows-latest is a free hosted runner; it runs on the push to main and on
    # dispatch, not on every PR push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: 'windows-latest'
    timeout-minutes: 90
    steps:
      - name: Getting the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install dependencies
        run: |
          choco install --yes --no-progress make

      - name: Installing node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: 'Cleanup cache'
        shell: powershell
        continue-on-error: true
        run: |
          $path = "$Env:APPDATA\jan"
          if (Test-Path $path) {
              Remove-Item "\\?\$path" -Recurse -Force
          } else {
              Write-Output "Folder does not exist."
          }
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version

      - name: Linter and test
        shell: powershell
        run: |
          make test-ci
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-on-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Getting the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every third-party action must be pinned to a full 40-hex commit SHA
      # (#194). Local actions (`uses: ./...`) and docker:// references are exempt.
      - name: Check actions are pinned to commit SHAs
        shell: bash
        run: |
          bad=$(grep -rnE '^[[:space:]-]*uses:[[:space:]]*' .github/workflows .github/actions 2>/dev/null \
            | grep -vE 'uses:[[:space:]]*["'"'"']?(\./|docker://)' \
            | grep -vE 'uses:[[:space:]]*["'"'"']?[^@[:space:]]+@[0-9a-f]{40}([[:space:]"'"'"']|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Actions not pinned to a 40-hex commit SHA:"
            echo "$bad"
            exit 1
          fi

      - name: Installing node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      # Dependency-free node:test suites (registry gate, archive/local-only
      # guards, installer templates). Same files as `yarn test:scripts`; the
      # shell expands the globs because node 20's --test does not (#37).
      - name: Script tests
        run: node --test scripts/*.test.mjs scripts/agent-harness/*.test.mjs

      # Every locale must have every namespace and key English has, with the
      # same {{placeholders}}. Keys a locale has but English does not are
      # warnings.
      - name: Locale parity
        run: node scripts/check-locale-parity.mjs

      - name: Install Tauri dependencies
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 webkit2gtk-driver

      - name: 'Cleanup cache'
        continue-on-error: true
        run: |
          rm -rf ~/jan
          make clean

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version

      - name: Linter and test
        # The LSP integration tests need gopls on PATH; the runner image does
        # not carry it, and the suite's documented opt-out is this variable.
        env:
          JAN_SKIP_LSP_TESTS: '1'
        run: |
          export DISPLAY=$(w -h | awk 'NR==1 {print $2}')
          echo -e "Display ID: $DISPLAY"
          make test-ci
          make check-cli
