name: Installer UI

on:
  pull_request:
    paths:
      - 'src-tauri/installer/**'
      - 'src-tauri/tauri.bundle.windows.nsis*.template'
      - 'src-tauri/tauri.windows.conf.json'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/plugins/tauri-plugin-hardware/**'
      - 'src-tauri/plugins/tauri-plugin-llamacpp/**'
      - 'src-tauri/build-utils/check-engine-toolchain.sh'
      - 'scripts/prepare-windows-installer.mjs'
      - 'scripts/windows-installer*.mjs'
      - 'scripts/windows-installer-smoke.nsi'
      - 'scripts/windows-msi*'
      - '.github/workflows/installer-ui.yml'
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version

      - name: Install dependencies
        shell: bash
        run: yarn install --immutable

      - name: Generate the canonical Flint platform icon set
        shell: bash
        run: yarn build:icon

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Test installer wiring
        shell: pwsh
        run: node --test scripts/windows-installer-template.test.mjs scripts/windows-installer-custom-ui.test.mjs scripts/windows-msi-ui.test.mjs

      - name: Prepare production template
        shell: pwsh
        run: node scripts/prepare-windows-installer.mjs

      - name: Compile custom installer UI with warnings as errors
        shell: pwsh
        run: |
          $root = (Resolve-Path .).Path
          & "C:\Program Files (x86)\NSIS\makensis.exe" /WX "/DFLINT_SMOKE_ROOT=$root" scripts\windows-installer-smoke.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The image ships WiX 3.14 (its path is in $env:WIX). Tauri runs `light` with ICE
      # validation, which rejects a wizard missing a standard dialog or with a button
      # that does nothing, so run it the same way here, in seconds, on a throwaway product.
      - name: Compile and validate the MSI wizard
        shell: pwsh
        run: |
          $wix = if ($env:WIX) { Join-Path $env:WIX 'bin' } else { 'C:\Program Files (x86)\WiX Toolset v3.14\bin' }
          if (-not (Test-Path "$wix\candle.exe")) { choco install wixtoolset --yes --no-progress; $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin' }
          $root = (Resolve-Path .).Path
          $work = Join-Path $env:RUNNER_TEMP 'msi-smoke'
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item "$env:WINDIR\System32\hostname.exe" "$work\dummy.exe"
          Push-Location $work
          & "$wix\candle.exe" -nologo -ext WixUIExtension -arch x64 "$root\scripts\windows-msi-smoke.wxs" "$root\src-tauri\installer\wix\flint-ui.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$wix\light.exe" -nologo -ext WixUIExtension -out flint-smoke.msi windows-msi-smoke.wixobj flint-ui.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

  windows-package:
    name: Release-grade Windows build
    needs: windows-installer
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      NODE_OPTIONS: '--max-old-space-size=4096'
      RUSTFLAGS: '-D warnings'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision make
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --yes --no-progress
            Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
          }

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Configure Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Set up the release engine toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: vulkan

      - name: Build Flint and Windows bundles
        shell: bash
        env:
          FLINT_ENGINE_BUILD_DIR: '${{ runner.temp }}\flint-engine'
        run: |
          set -o pipefail
          make build 2>&1 | tee windows-build.log

      - name: Verify Windows bundles were produced
        shell: bash
        run: |
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*-setup.exe' -o -name '*.msi' \) -print | tee windows-bundles.txt
          test -s windows-bundles.txt

      - name: Report ccache statistics
        if: success() || failure()
        shell: bash
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -s; else echo "ccache not available"; fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-installer-pr-windows-build-log
          path: windows-build.log
          if-no-files-found: warn
