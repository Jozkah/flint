name: Flint Engine Add-on (CUDA)

# Builds the CUDA engine add-on pack for Windows and Linux x64 and attaches it
# to a release, next to the Vulkan-only installers flint-release.yml makes. The
# app offers the pack to NVIDIA users and downloads it only when they click
# (src-tauri/plugins/tauri-plugin-llamacpp/src/engine/addon.rs).
#
# flint-release.yml calls this for every nightly and stable run, with the same
# tag, so each release carries the pack built from its own engine pin; a
# mismatched pack is refused by the app. Run it by hand to (re)build the pack
# of an existing release.
#
# A failed pack never fails the release: the jobs below continue on error and
# the app simply finds no pack for that release and stays on Vulkan.
#
# Signing: FLINT_ADDON_SIGNING_KEY (repository secret, made by
# scripts/engine-addon/keygen.mjs) signs the manifest; the app verifies it with
# the public key committed in src-tauri/plugins/tauri-plugin-llamacpp/
# addon-signing.pub. Without the secret no pack is published.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build the pack for and attach it to.'
        required: true
        type: string
      ref:
        description: 'Commit to build (the release commit). Defaults to the tag.'
        required: false
        type: string
        default: ''
    secrets:
      FLINT_ADDON_SIGNING_KEY:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build the CUDA pack for (e.g. v1.0.0).'
        required: true
        default: ''

concurrency:
  group: flint-engine-addon-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CUDA 13.0 keeps the driver floor at R580 (engine/driver.rs, addon.rs). The
  # variant's major must match: check-engine-toolchain.sh compares it with nvcc.
  CUDA_REDIST_VERSION: '13.0.2'
  ENGINE_VARIANT: cuda13-vulkan
  ADDON_KIND: cuda13

jobs:
  pack:
    name: CUDA pack (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Hosted jobs stop at 6 h; a cold nvcc build is ~1-1.5 h.
    timeout-minutes: 300
    continue-on-error: true
    env:
      TAG: ${{ inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            # windows-latest now carries only VS 2026 (MSVC 14.51), which crashes nvcc 13's
            # cudafe++; the step below adds the 14.44 toolset (VS 2022 era).
            os: windows-latest
          - platform: linux-x64
            os: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'; then
            echo "::error::not a usable release tag: '$INPUT_TAG'"
            exit 1
          fi

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || inputs.tag }}

      - name: Provision make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
          }

      # The toolkit is ~3 GB unpacked with the static cuBLAS, plus the CUDA
      # objects; the hosted Ubuntu image has ~14 GB free.
      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Add the MSVC 14.44 toolset on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath "$installer\setup.exe" -ArgumentList @('modify','--installPath',"`"$vs`"",'--add','Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64','--quiet','--norestart','--noUpdateInstaller')
          Write-Host "setup.exe exit code $($p.ExitCode)"
          Get-ChildItem "$vs\VC\Tools\MSVC" | ForEach-Object Name
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.44*")) { throw 'MSVC 14.44 toolset was not installed' }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri/plugins/tauri-plugin-llamacpp
          key: flint-engine-addon-${{ matrix.platform }}
          cache-on-failure: true

      - name: Fetch the CUDA toolkit
        run: |
          if command -v nvcc >/dev/null 2>&1; then
            echo "nvcc already on the image: $(command -v nvcc)"
            exit 0
          fi
          prefix="$RUNNER_TEMP/cuda"
          bash src-tauri/build-utils/fetch-cuda-redist.sh "$CUDA_REDIST_VERSION" "$prefix" \
            cuda_nvcc cuda_crt cuda_cudart cuda_cccl libnvvm libcublas
          if [ "$RUNNER_OS" = Windows ]; then
            prefix="$(cygpath -w "$prefix")"
            echo "$prefix\\bin" >> "$GITHUB_PATH"
            echo "$prefix\\bin\\x64" >> "$GITHUB_PATH"
          else
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi
          for v in CUDA_PATH CUDA_HOME CUDAToolkit_ROOT; do echo "$v=$prefix" >> "$GITHUB_ENV"; done

      # Selects the variant, provisions ccache, the Vulkan SDK and (Windows)
      # the MSVC environment nvcc needs, then checks nvcc reports CUDA 13.
      - name: Set up the llama.cpp engine toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: ${{ env.ENGINE_VARIANT }}

      # Only the engine: the pack is the ggml-cuda module, which loads into the
      # Vulkan installer's worker. Same llama.cpp pin as that installer.
      - name: Build the engine
        env:
          # The hosted image's MSVC can be newer than nvcc 13.0 knows about.
          NVCC_APPEND_FLAGS: ${{ runner.os == 'Windows' && '-allow-unsupported-compiler' || '' }}
        run: make build-engine

      - name: Stage the CUDA runtime
        run: bash src-tauri/build-utils/stage-cuda-runtime.sh

      - name: Report ccache statistics
        if: success() || failure()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -s; else echo "ccache not available"; fi

      - name: Make and sign the pack
        env:
          FLINT_ADDON_SIGNING_KEY: ${{ secrets.FLINT_ADDON_SIGNING_KEY }}
        run: |
          node scripts/engine-addon/pack.mjs --bin-dir src-tauri/resources/bin \
            --kind "$ADDON_KIND" --tag "$TAG" --platform "${{ matrix.platform }}" \
            --cuda-toolkit "${CUDA_REDIST_VERSION%.*}" --min-driver 580 --min-compute 75 \
            --out dist-addon
          ls -l dist-addon

      - name: Keep the pack as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-engine-addon-${{ inputs.tag }}-${{ matrix.platform }}
          path: dist-addon/*
          if-no-files-found: error

      - name: Upload the engine build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-addon-build-log-${{ matrix.platform }}
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore

  # The build jobs run with a read-only token. Only this job, which runs no
  # repository code, may write to the release.
  upload:
    name: Attach the packs to the release
    needs: pack
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Download the packs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: flint-engine-addon-${{ inputs.tag }}-*
          path: packs
          merge-multiple: true

      # One SHA256SUMS for the release's add-on assets, and the same lines for
      # the release notes; the app itself checks the signed manifest instead.
      - name: Upload the packs and their checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          cd packs
          files=(flint-engine-*.zip flint-engine-*.json flint-engine-*.json.sig)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::warning::no engine add-on was built for $TAG; the app stays on Vulkan for this release"
            exit 0
          fi
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS-engine-addons.txt
          cat SHA256SUMS-engine-addons.txt
          {
            echo "### Engine add-on checksums (SHA-256)"
            echo '```'
            cat SHA256SUMS-engine-addons.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" SHA256SUMS-engine-addons.txt --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "upload attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "::error::could not upload the engine add-on to $TAG"
          exit 1

      - name: Add the checksums to the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          [ -f packs/SHA256SUMS-engine-addons.txt ] || exit 0
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          body="$(printf '%s\n' "$body" | sed '/^<!-- engine-addon-sums -->$/,/^<!-- \/engine-addon-sums -->$/d')"
          {
            printf '%s\n\n' "$body"
            echo '<!-- engine-addon-sums -->'
            echo '**NVIDIA CUDA engine add-on** (downloaded from inside the app on NVIDIA GPUs; SHA-256):'
            echo '```'
            cat packs/SHA256SUMS-engine-addons.txt
            echo '```'
            echo '<!-- /engine-addon-sums -->'
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
