name: Flint Release

# Scheduled runs build an unsigned prerelease from main, at most twice a day and
# only when main moved. Every push to main also builds, but only keeps the bundles
# as workflow artifacts (no release). Manual runs attach bundles to an existing
# release. Stable release tags never move automatically.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '0 0,12 * * *'
      timezone: Europe/Lisbon
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload to (e.g. v0.9.0)'
        required: true
      optimize:
        description: 'Full size optimization (fat LTO, one codegen unit): much slower to build, slightly smaller binary. Off by default.'
        type: boolean
        default: false

# Serialize release uploads; midnight and noon get separate Lisbon-time tags.
# A newer push to main cancels the superseded artifact-only build.
concurrency:
  group: flint-release-${{ github.event_name == 'push' && format('push-{0}', github.ref) || github.event_name == 'schedule' && 'nightly' || github.event.inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: '--max-old-space-size=4096'
  # Tag builds are unsigned and mostly for trying a release out, so they use
  # thin LTO with parallel codegen, which builds in roughly half the time of
  # the `[profile.release]` in Cargo.toml (fat LTO, one codegen unit, opt-level
  # z). Run the workflow by hand with `optimize` ticked for the full profile.
  FLINT_OPTIMIZE: ${{ inputs.optimize && 'full' || 'fast' }}
  CARGO_PROFILE_RELEASE_LTO: ${{ inputs.optimize && 'fat' || 'thin' }}
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.optimize && '1' || '16' }}
  CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ inputs.optimize && 'z' || 's' }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - name: Create nightly draft or check existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Artifact-only build of this exact commit; no release is created.
            tag="nightly-ci-${GITHUB_SHA::7}"
            ref="$GITHUB_SHA"
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # A draft release does not create its Git tag until publication.
            # Build the event's immutable main commit, not the pending tag.
            ref="$GITHUB_SHA"
            slot="$(TZ=Europe/Lisbon date +%Y%m%d-%H)"
            tag="nightly-$slot"
            # Notes list only changes new since the previous nightly; changes
            # already shipped in older nightlies sit in a collapsed section.
            baseline="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
              --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [ -z "$baseline" ]; then
              echo "Cannot generate nightly notes without a stable release baseline" >&2
              exit 1
            fi
            # The previous nightly comes from Git tags, so it is found even if its
            # release was deleted. Nothing new on main since it means no build.
            last="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/nightly-" \
              --jq '.[] | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"' | sort | grep -v "^$tag " | tail -n 1 || true)"
            previous="${last% *}"
            if [ -n "$last" ] && [ "${last#* }" = "$GITHUB_SHA" ]; then
              echo "No commits since $previous; skipping this nightly"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A nightly that never finished stays a draft with no Git tag. Drop the
            # drafts of other slots so they do not pile up next to the real ones.
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft               --jq '.[] | select(.isDraft and (.tagName | test("^nightly-[0-9]"))) | .tagName'               | grep -vx "$tag" | while read -r stale; do
                echo "Removing the unfinished draft $stale"
                gh release delete "$stale" --repo "$GITHUB_REPOSITORY" --yes || true
              done
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Reusing existing nightly release $tag"
            else
              notes_for() {
                gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" \
                  -f target_commitish="$GITHUB_SHA" -f previous_tag_name="$1" --jq .body | grep '^\* ' \
                  | sed -E "s# by @${GITHUB_REPOSITORY_OWNER} in (https://[^ ]+)# (\1)#" || true
              }
              all="$(notes_for "$baseline")"
              if [ -n "$previous" ]; then
                new="$(notes_for "$previous")"
                printf '%s\n' "$new" > "$RUNNER_TEMP/new-notes.txt"
                old="$(printf '%s\n' "$all" | grep -vxFf "$RUNNER_TEMP/new-notes.txt" || true)"
              else
                new="$all"
                old=""
              fi
              {
                echo "Unsigned desktop bundles built from $GITHUB_SHA. Changes since $baseline (not included in the stable release)."
                echo
                echo "## What's Changed"
                echo "${new:-No new changes since the previous nightly.}"
                if [ -n "$old" ]; then
                  echo
                  echo "<details><summary>Present from older nightly builds</summary>"
                  echo
                  echo "$old"
                  echo
                  echo "</details>"
                fi
                echo
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$baseline...$tag"
              } > "$RUNNER_TEMP/notes.md"
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" --draft --prerelease --latest=false \
                --title "Flint nightly $(TZ=Europe/Lisbon date +%Y-%m-%d\ %H:00)" \
                --notes-file "$RUNNER_TEMP/notes.md"
            fi
          else
            tag="$INPUT_TAG"
            ref="$tag"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS .exe + .msi. Vulkan is the engine variant the hosted image can
          # build (the setup action provisions the SDK).
          - name: windows-x64
            os: windows-latest
            engine_variant: vulkan
            rust_targets: ''
          # Apple silicon .dmg. A universal build compiles the whole app (and the
          # CLI) twice and merges the slices, which made this the slowest job by
          # far; the engine worker and MLX server are arm64-only anyway.
          - name: macos-arm64
            os: macos-latest
            engine_variant: metal
            rust_targets: 'aarch64-apple-darwin'
            mac_arch: arm64
          # AppImage + .deb. 22.04 keeps the glibc floor low.
          - name: linux-x64
            os: ubuntu-22.04
            engine_variant: vulkan
            rust_targets: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      # The Makefile recipes are bash and make; the hosted Windows image has
      # Git Bash but not always make.
      - name: Provision make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
          }

      # The engine build plus the app build overflow the ~14 GB free on the
      # hosted Ubuntu image.
      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 libappindicator3-dev

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false
          echo "FLINT_YARN_CACHE_PATH=$(yarn config get cacheFolder)" >> "$GITHUB_ENV"

      - name: Restore the Yarn cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.FLINT_YARN_CACHE_PATH }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: flint-release-${{ matrix.name }}-${{ env.FLINT_OPTIMIZE }}
          # Saved even when the build fails, so a retry starts from what was
          # already compiled instead of from nothing.
          cache-on-failure: true

      # Selects the variant, provisions ccache (and the Vulkan SDK when the
      # variant needs it) and fails fast if the image cannot build it.
      - name: Set up the llama.cpp engine toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: ${{ matrix.engine_variant }}

      # `make build` is the same path as a local release build:
      #   yarn install, build:tauri:plugin:api, build:core, build:extensions,
      #   build-engine (flint-llama-worker + ggml libraries staged into
      #   src-tauri/resources/bin), then `yarn build` = build:web + build:tauri,
      #   which runs build:icon, copy:assets:tauri, download:bin (bun, uv,
      #   sqlite-vec from their public GitHub releases), build:cli (flint),
      #   build-mlx-server on macOS, check:sidecars and `tauri build`.
      # Unsigned: createUpdaterArtifacts is false in tauri.conf.json, no
      # TAURI_SIGNING_*/APPLE_* variables are set, and
      # JAN_ENGINE_REQUIRE_SIGNING is left unset so sign-engine.sh skips.
      - name: Build Flint
        env:
          # Read by the Makefile and package.json: build one macOS slice.
          FLINT_MAC_ARCH: ${{ matrix.mac_arch }}
          FLINT_MAC_TARGET: ${{ matrix.mac_arch == 'arm64' && 'aarch64-apple-darwin' || '' }}
        run: make build

      # Windows gives the main thread 1 MB unless the exe asks for more, and the
      # release build overflowed that on the first tool call; a debug build never
      # shows it. src-tauri/build.rs sets the reserve, and this fails the build if
      # the exe it produced does not carry it.
      - name: Check the main thread stack (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/check-main-thread-stack.mjs src-tauri/target/release/Flint-Desktop.exe

      - name: Report ccache statistics
        if: success() || failure()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -s; else echo "ccache not available"; fi

      - name: Collect the bundles
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          ls -l dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no bundles were produced"
            exit 1
          fi
          (cd dist && for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done) > "dist-sha256-${{ matrix.name }}.txt"
          cat "dist-sha256-${{ matrix.name }}.txt"

      # The runner's network drops now and then (ENOTFOUND on CreateArtifact),
      # which used to fail a whole nightly after a 15 minute build and leave its
      # draft behind. Try again before giving up.
      - name: Keep the bundles as a workflow artifact
        id: keep
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-${{ env.TAG }}-${{ matrix.name }}
          path: |
            dist/*
            dist-sha256-${{ matrix.name }}.txt
          if-no-files-found: error

      - name: Keep the bundles as a workflow artifact (second try)
        if: steps.keep.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-${{ env.TAG }}-${{ matrix.name }}
          path: |
            dist/*
            dist-sha256-${{ matrix.name }}.txt
          if-no-files-found: error

      - name: Upload the engine build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-build-log-${{ matrix.name }}
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore

  # The build jobs run with a read-only token. Only this job, which runs no
  # repository code, may write to the release.
  upload-release:
    name: Upload the bundles to the release
    if: github.event_name != 'push' && needs.prepare.outputs.skip != 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: flint-${{ needs.prepare.outputs.tag }}-*
          path: bundles
          merge-multiple: true

      - name: Upload the bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(bundles/dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no bundles were downloaded"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # Nightly prereleases pile up: keep the newest few and anything younger than
  # two weeks.
  prune-nightly:
    name: Prune old nightly prereleases
    if: github.event_name == 'schedule'
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete nightlies older than 14 days, keeping the newest 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          old="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300             --json tagName,createdAt,isPrerelease             --jq "[.[] | select((.tagName | test(\"^nightly-[0-9]\")) and .isPrerelease)] | sort_by(.createdAt) | reverse | .[3:] | .[] | select(.createdAt < \"$cutoff\") | .tagName")"
          for tag in $old; do
            echo "Deleting $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done

  publish-nightly:
    name: Publish nightly prerelease
    if: github.event_name == 'schedule' && needs.prepare.outputs.skip != 'true'
    needs: [prepare, build, upload-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish complete nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # The CLI also finds draft releases; the by-tag REST endpoint is
          # intended for published releases.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --latest=false
