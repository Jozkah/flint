name: Flint Release

# Builds the unsigned Flint desktop bundles on GitHub-hosted runners and
# attaches them to an existing GitHub release. The release itself (title,
# notes) is created by hand; this workflow never creates or edits one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and upload to (e.g. v0.9.0)'
        required: true
        default: 'v0.9.0'
  push:
    tags: ['v*']

concurrency:
  group: flint-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  # Fail in seconds rather than after an hour of compiling when the tag has no
  # release to attach to.
  check-release:
    name: Check the release exists
    runs-on: ubuntu-latest
    steps:
      - name: Look up the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft

  build:
    name: Build (${{ matrix.name }})
    needs: check-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS .exe + .msi. Vulkan is the engine variant the hosted image can
          # build (the setup action provisions the SDK).
          - name: windows-x64
            os: windows-latest
            engine_variant: vulkan
            rust_targets: ''
          # Universal .dmg: `build:tauri:darwin` passes
          # --target universal-apple-darwin, and build-cli lipo's both slices.
          # The engine worker is host-arch (arm64) only.
          - name: macos-universal
            os: macos-latest
            engine_variant: metal
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # AppImage + .deb. 22.04 keeps the glibc floor low.
          - name: linux-x64
            os: ubuntu-22.04
            engine_variant: vulkan
            rust_targets: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TAG }}

      # The Makefile recipes are bash and make; the hosted Windows image has
      # Git Bash but not always make.
      - name: Provision make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
          }

      # The engine build plus the app build overflow the ~14 GB free on the
      # hosted Ubuntu image.
      - name: Free disk space on Linux
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 libappindicator3-dev

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn --version
          yarn config set -H enableImmutableInstalls false
          echo "YARN_CACHE_DIR=$(yarn config get cacheFolder)" >> "$GITHUB_ENV"

      - name: Restore the Yarn cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.YARN_CACHE_DIR }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Restore the Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: flint-release-${{ matrix.name }}

      # Selects the variant, provisions ccache (and the Vulkan SDK when the
      # variant needs it) and fails fast if the image cannot build it.
      - name: Set up the llama.cpp engine toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: ${{ matrix.engine_variant }}

      # `make build` is the same path as a local release build:
      #   yarn install, build:tauri:plugin:api, build:core, build:extensions,
      #   build-engine (flint-llama-worker + ggml libraries staged into
      #   src-tauri/resources/bin), then `yarn build` = build:web + build:tauri,
      #   which runs build:icon, copy:assets:tauri, download:bin (bun, uv,
      #   sqlite-vec from their public GitHub releases), build:cli (flint),
      #   build-mlx-server on macOS, check:sidecars and `tauri build`.
      # Unsigned: createUpdaterArtifacts is false in tauri.conf.json, no
      # TAURI_SIGNING_*/APPLE_* variables are set, and
      # JAN_ENGINE_REQUIRE_SIGNING is left unset so sign-engine.sh skips.
      - name: Build Flint
        run: make build

      - name: Report ccache statistics
        if: success() || failure()
        run: |
          if command -v ccache >/dev/null 2>&1; then ccache -s; else echo "ccache not available"; fi

      - name: Collect the bundles
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} dist/ \;
          ls -l dist
          if [ -z "$(ls -A dist)" ]; then
            echo "::error::no bundles were produced"
            exit 1
          fi
          (cd dist && for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done) > "dist-sha256-${{ matrix.name }}.txt"
          cat "dist-sha256-${{ matrix.name }}.txt"

      - name: Keep the bundles as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flint-${{ env.TAG }}-${{ matrix.name }}
          path: |
            dist/*
            dist-sha256-${{ matrix.name }}.txt
          if-no-files-found: error

      - name: Upload the bundles to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload the engine build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-build-log-${{ matrix.name }}
          path: src-tauri/target/engine-build.log
          if-no-files-found: ignore
