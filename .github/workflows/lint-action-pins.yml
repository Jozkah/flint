name: Lint action pins

on:
  pull_request:
    branches: [main]
    paths: ['.github/**']

concurrency:
  group: lint-action-pins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pins:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-24.04
    steps:
      - name: Getting the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every third-party action must be pinned to a full 40-hex commit SHA.
      # Local actions (`uses: ./...`) and docker:// references are exempt.
      - name: Check actions are pinned to commit SHAs
        shell: bash
        run: |
          bad=$(grep -rnE '^[[:space:]-]*uses:[[:space:]]*' .github/workflows .github/actions 2>/dev/null \
            | grep -vE 'uses:[[:space:]]*["'"'"']?(\./|docker://)' \
            | grep -vE 'uses:[[:space:]]*["'"'"']?[^@[:space:]]+@[0-9a-f]{40}([[:space:]"'"'"']|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Actions not pinned to a 40-hex commit SHA:"
            echo "$bad"
            exit 1
          fi
