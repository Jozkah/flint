name: iOS IPA
on:
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Builds the phone app as an UNSIGNED .ipa. Nothing here needs an Apple
  # developer account: whoever installs it re-signs it with their own Apple ID
  # (AltStore, SideStore, Sideloadly), which is also why the signing settings
  # below are forced off.
  ipa:
    name: unsigned ipa
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ios-ipa
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies and render icons
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn install
          yarn build:icon

      - name: Stage bundle resources
        run: |
          mkdir -p src-tauri/resources
          cp LICENSE src-tauri/resources/LICENSE

      - name: Tooling
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          xcodegen --version

      # Xcode reads a global xcconfig from XCODE_XCCONFIG_FILE, which lets the
      # tauri CLI drive xcodebuild without the project knowing it is unsigned.
      - name: Disable code signing
        run: |
          cat > "$RUNNER_TEMP/unsigned.xcconfig" <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          EOF
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/unsigned.xcconfig" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        env:
          APPLE_DEVELOPMENT_TEAM: 0000000000
        run: yarn tauri ios init --ci

      # The generated project asks for automatic signing with a team, which
      # needs an Apple account; scripts/unsign-ios-project.py switches it off.
      - name: Make the project unsigned
        run: python3 scripts/unsign-ios-project.py src-tauri/gen/apple

      - name: Build
        env:
          APPLE_DEVELOPMENT_TEAM: 0000000000
        # The export step needs a signing identity and is expected to fail; the
        # archive that precedes it holds the unsigned .app, collected below.
        run: yarn tauri ios build --ci -- --no-default-features --features mobile || echo "tauri ios build exited $? (export needs signing; checking for the archive)"

      - name: Package the .app as an .ipa
        run: |
          set -e
          app=$(find src-tauri/gen/apple -type d -name '*.app' -path '*Products*' | head -n1)
          if [ -z "$app" ]; then
            echo "no .app found; build output:"
            find src-tauri/gen/apple -maxdepth 4 | head -80
            exit 1
          fi
          echo "app: $app"
          plutil -p "$app/Info.plist"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../Flint-unsigned.ipa Payload)
          ls -la Flint-unsigned.ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flint-unsigned-ipa
          path: Flint-unsigned.ipa
          if-no-files-found: error
