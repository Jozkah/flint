name: Agent SDKs
# Ported from upstream janhq/jan#9058 (SDK job) and #9052 (cookbook step).
# Upstream runs these inside rust-check.yml on every push; here they run on a
# PR to main that touches the runtime's RPC surface or a client of it, plus a
# manual trigger, so routine pushes do not spend Actions minutes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/agent-sdk/**'
      - 'sdk/python/**'
      - 'examples/agent-sdk/**'
      - 'protocol/rpc-schema.json'
      - 'docs/src/pages/docs/agent/sdk*.mdx'
      - 'src-tauri/src/core/cli/**'
      - 'src-tauri/src/core/agent/events.rs'
      - 'src-tauri/src/bin/flint.rs'
      - 'src-tauri/tests/sdk_examples.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/agent-sdk.yml'

concurrency:
  group: agent-sdk-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The SDKs are clients of the same channel the CLI tests drive, so they run
  # against a real runtime binary: a client that only agreed with itself would
  # pass. The committed wire types are checked against protocol/rpc-schema.json
  # in the same job, since that document is what generates them.
  sdk:
    name: agent SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: sdk
          # Branches restore but never save: one cache set on main.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      # The runtime the SDKs drive, built the way a user builds the CLI.
      - name: Build the flint runtime
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli --bin flint
          echo "JAN_BIN=$PWD/src-tauri/target/debug/flint" >> "$GITHUB_ENV"

      # For the SDK's own type-check. The suite itself needs no dependency: the
      # package has none, and `node --test` is in the runtime.
      - name: Install the workspace
        run: |
          corepack enable
          yarn install --immutable

      - name: Type-check the JavaScript SDK
        run: yarn workspace @janhq/agent-sdk check-types

      - name: JavaScript SDK suite
        run: yarn workspace @janhq/agent-sdk test

      # The Python client reaches the runtime without Node, so it runs with a
      # PATH that has no node on it: the claim is checked, not stated.
      - name: Python SDK suite
        run: |
          env -i PATH="$(dirname "$JAN_BIN"):/usr/bin:/bin" HOME="$HOME" \
            JAN_BIN="$JAN_BIN" python3 -m unittest discover -s sdk/python/tests -t sdk/python

      # The Agent SDK cookbook's runnable source, run with the runner's own
      # node and python3 against the flint binary this commit builds, plus the
      # check that every docs excerpt still matches the file it quotes.
      - name: cargo test (Agent SDK examples)
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml \
            --no-default-features --features cli --test sdk_examples
