name: "Auto Label Conventional Commits"
on:
  pull_request:
    types:
      - reopened
      - opened
jobs:
  label_prs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Label PRs
        run: |
          ISSUE_TITLE=$(gh issue view ${{ github.event.number }} --json title -q ".title")
          LABEL=$(bash .github/scripts/pr-type-label.sh "$ISSUE_TITLE")
          if [ -n "$LABEL" ]; then
            # The repo may not have the label yet; create it rather than fail.
            gh label create "$LABEL" 2>/dev/null || true
            gh issue edit ${{ github.event.number }} --add-label "$LABEL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
