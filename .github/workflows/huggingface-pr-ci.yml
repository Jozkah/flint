name: Hugging Face Hub PR CI

on:
  push:
    branches:
      - feat/huggingface-model-downloads

concurrency:
  group: huggingface-hub-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build bundled extensions
        run: yarn build:extensions
      - name: Generate routes and bundle web app
        run: yarn workspace @janhq/web-app vite build
      - name: Typecheck web app against main baseline
        shell: bash
        run: |
          set +e
          yarn typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # main currently has these four unrelated Cowork errors. Keep running
          # the full typecheck, but do not make this model-Hub PR own that debt.
          grep 'error TS' /tmp/typecheck.log > /tmp/type-errors.log || true
          grep -vE \
            'src/containers/CoworkWorkflowCard\.tsx\(134,15\): error TS2367|src/lib/coworkRunOutcome\.ts\((885,47|890,33)\): error TS2339|src/lib/coworkTools\.ts\(411,51\): error TS2339' \
            /tmp/type-errors.log > /tmp/new-type-errors.log || true

          if [ -s /tmp/new-type-errors.log ]; then
            echo 'New TypeScript errors introduced by this branch:'
            cat /tmp/new-type-errors.log
            exit 1
          fi

          echo 'Typecheck contains only the known errors already present on main.'
      - name: Test Hub and privacy guards
        run: yarn vitest run --project @janhq/web-app web-app/src/lib/__tests__/huggingface.test.ts web-app/src/__tests__/localOnly.test.ts

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare Tauri resources for compile-only CI
        run: ./scripts/stub-tauri-resources.sh
      - name: Check desktop crate
        run: cargo check --manifest-path src-tauri/Cargo.toml --lib
