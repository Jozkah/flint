name: Jan Agent CLI - Nightly Build

on:
  schedule:
    - cron: '0 10 * * 2,4' # 10 AM UTC Tuesday and Thursday
  workflow_dispatch:

concurrency:
  group: agent-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_BRANCH: refs/heads/dev

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve target ref
        id: resolve
        run: |
          echo "ref=${{ env.AGENT_BRANCH }}" >> "$GITHUB_OUTPUT"

  get-update-version:
    uses: ./.github/workflows/template-get-update-version.yml

  build-linux-x64:
    uses: ./.github/workflows/template-cli-build-linux-x64.yml
    needs: [get-update-version, resolve-ref]
    secrets: inherit
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: agent-nightly

  build-macos:
    uses: ./.github/workflows/template-cli-build-macos.yml
    needs: [get-update-version, resolve-ref]
    secrets: inherit
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: agent-nightly

  build-windows-x64:
    uses: ./.github/workflows/template-cli-build-windows-x64.yml
    needs: [get-update-version, resolve-ref]
    secrets: inherit
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: agent-nightly

  build-linux-aarch64:
    uses: ./.github/workflows/template-cli-build-linux-aarch64.yml
    needs: [get-update-version, resolve-ref]
    secrets: inherit
    with:
      ref: ${{ needs.resolve-ref.outputs.ref }}
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      channel: agent-nightly

