name: Platform verification

# Manual run only. Exercises, on each OS, the paths docs/FEATURES.md lists
# under "Not finished yet" that unit tests cover in part: the closed-app
# scheduler entry and the network CA check. Standard free runners.
# PDF/PNG export and the browser screenshot need a display and the desktop
# app, so they are not run here and their FEATURES.md lines stay as written.

on:
  workflow_dispatch:

concurrency:
  group: platform-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev

      # rc.exe embeds icon.ico and rejects the PNG copy the stub script makes.
      - name: Render the Windows icon
        if: runner.os == 'Windows'
        shell: bash
        run: npx --yes @tauri-apps/cli@2.11.4 icon src-tauri/icons/icon.png -o src-tauri/icons

      - name: Stub bundled resources
        shell: bash
        run: ./scripts/stub-tauri-resources.sh

      - name: Scheduler entry enable and disable
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri --lib os_scheduler -- --nocapture

      - name: Network CA handling
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --features test-tauri --lib core::net -- --nocapture
