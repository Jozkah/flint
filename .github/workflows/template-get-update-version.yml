name: get-update-version

on:
  workflow_call:
    outputs:
      new_version:
        description: 'The new version of the app'
        value: ${{ jobs.get-update-version.outputs.new_version }}

jobs:
  get-update-version:
    runs-on: ubuntu-24.04
    outputs:
      new_version: ${{ steps.version_update.outputs.new_version }}
    steps:
      - name: Install jq
        uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0

      - name: Update app version
        id: version_update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" && "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
            echo "Tag detected: $REF_NAME -> $version"
          else
            latest_tag=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPOSITORY}/releases/latest" \
              | jq -r '.tag_name // empty')

            if [[ -z "$latest_tag" ]]; then
              echo "::error::Could not determine the latest release tag."
              exit 1
            fi

            version="${latest_tag#v}-${RUN_NUMBER}"
            echo "Dispatch build version: $version"
          fi

          echo "new_version=$version" >> "$GITHUB_OUTPUT"
