name: Tauri Builder - Tag

on:
  # Manual only. Tag pushes are owned by flint-release.yml, which attaches
  # unsigned bundles to a hand-made release; running both per tag would build
  # everything twice and this workflow edits/creates the release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and upload to (e.g. v0.9.0). Must be explicit.'
        required: true

concurrency:
  group: tauri-tag-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  # Job create Update app version based on latest release tag with build number and save to output
  get-update-version:
    uses: ./.github/workflows/template-get-update-version.yml

  # Single owner of the release: find it by tag (drafts included) or create a
  # draft, then remove stale assets so re-uploads do not 422. Published
  # releases are never touched.
  resolve-release-url:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.resolve.outputs.upload_url }}
    permissions:
      contents: write
    steps:
      - name: Resolve upload URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::An explicit tag input is required."
            exit 1
          fi

          # /releases/tags/<tag> 404s for drafts, so list and select by tag_name.
          RELEASE_JSON=$(gh api --paginate "repos/$REPO/releases?per_page=100"             | jq -s --arg tag "$TAG" 'add | map(select(.tag_name == $tag)) | .[0] // empty')

          if [ -z "$RELEASE_JSON" ]; then
            echo "No release for $TAG; creating a draft"
            RELEASE_JSON=$(gh api -X POST "repos/$REPO/releases"               -f tag_name="$TAG" -f name="${TAG#v}"               -F draft=true -F prerelease=false -F generate_release_notes=true)
          fi

          RELEASE_ID=$(echo "$RELEASE_JSON" | jq -r '.id')
          IS_DRAFT=$(echo "$RELEASE_JSON" | jq -r '.draft')
          UPLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.upload_url')

          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release $TAG is published; refusing to delete its assets. Convert it to a draft first."
            exit 1
          fi

          echo "Deleting stale assets from release $RELEASE_ID"
          gh api --paginate "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[].id' | while read -r ASSET_ID; do
            echo "  Deleting asset $ASSET_ID"
            gh api -X DELETE "repos/$REPO/releases/assets/$ASSET_ID"
          done

          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "Resolved upload URL: $UPLOAD_URL"

  build-macos:
    uses: ./.github/workflows/template-tauri-build-macos.yml
    secrets: inherit
    needs: [get-update-version, resolve-release-url]
    with:
      ref: refs/tags/${{ inputs.tag }}
      public_provider: github
      channel: stable
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      upload_url: ${{ needs.resolve-release-url.outputs.upload_url }}

  build-windows-x64:
    uses: ./.github/workflows/template-tauri-build-windows-x64.yml
    secrets: inherit
    needs: [get-update-version, resolve-release-url]
    with:
      ref: refs/tags/${{ inputs.tag }}
      public_provider: github
      channel: stable
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      upload_url: ${{ needs.resolve-release-url.outputs.upload_url }}

  build-linux-x64:
    uses: ./.github/workflows/template-tauri-build-linux-x64.yml
    secrets: inherit
    needs: [get-update-version, resolve-release-url]
    with:
      ref: refs/tags/${{ inputs.tag }}
      public_provider: github
      channel: stable
      new_version: ${{ needs.get-update-version.outputs.new_version }}
      upload_url: ${{ needs.resolve-release-url.outputs.upload_url }}

  sync-temp-to-latest:
    needs: [resolve-release-url, get-update-version, build-macos, build-windows-x64, build-linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Getting the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: create latest.json file
        run: |

          VERSION=${{ needs.get-update-version.outputs.new_version }}
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          LINUX_SIGNATURE="${{ needs.build-linux-x64.outputs.APPIMAGE_SIG }}"
          LINUX_URL="https://github.com/Jozkah/flint/releases/download/v${{ needs.get-update-version.outputs.new_version }}/${{ needs.build-linux-x64.outputs.APPIMAGE_FILE_NAME }}"
          WINDOWS_SIGNATURE="${{ needs.build-windows-x64.outputs.WIN_SIG }}"
          WINDOWS_URL="https://github.com/Jozkah/flint/releases/download/v${{ needs.get-update-version.outputs.new_version }}/${{ needs.build-windows-x64.outputs.FILE_NAME }}"
          DARWIN_SIGNATURE="${{ needs.build-macos.outputs.MAC_UNIVERSAL_SIG }}"
          DARWIN_URL="https://github.com/Jozkah/flint/releases/download/v${{ needs.get-update-version.outputs.new_version }}/${{ needs.build-macos.outputs.TAR_NAME }}"

          jq --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg linux_signature "$LINUX_SIGNATURE" \
            --arg linux_url "$LINUX_URL" \
            --arg windows_signature "$WINDOWS_SIGNATURE" \
            --arg windows_url "$WINDOWS_URL" \
            --arg darwin_arm_signature "$DARWIN_SIGNATURE" \
            --arg darwin_arm_url "$DARWIN_URL" \
            --arg darwin_amd_signature "$DARWIN_SIGNATURE" \
            --arg darwin_amd_url "$DARWIN_URL" \
            '.version = $version
              | .pub_date = $pub_date
              | .platforms["linux-x86_64"].signature = $linux_signature
              | .platforms["linux-x86_64"].url = $linux_url
              | .platforms["windows-x86_64"].signature = $windows_signature
              | .platforms["windows-x86_64"].url = $windows_url
              | .platforms["darwin-aarch64"].signature = $darwin_arm_signature
              | .platforms["darwin-aarch64"].url = $darwin_arm_url
              | .platforms["darwin-x86_64"].signature = $darwin_amd_signature
              | .platforms["darwin-x86_64"].url = $darwin_amd_url' \
            src-tauri/latest.json.template > latest.json
            cat latest.json

      - name: Upload release assert if public provider is github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/upload-release-asset@64e5e85fc528f162d7ba7ce2d15a3bb67efb3d80 # v1.0.1
        with:
          upload_url: ${{ needs.resolve-release-url.outputs.upload_url }}
          asset_path: ./latest.json
          asset_name: latest.json
          asset_content_type: text/json