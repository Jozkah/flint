nmHoistingLimits: workspaces
nodeLinker: node-modules
checksumBehavior: update

# Packages that use a peer dependency of their children without declaring it,
# which made every install end "Done with warnings" (YN0086).
packageExtensions:
  "@ai-sdk/react@*":
    peerDependencies:
      zod: "*"
  "@janhq/interfaces@*":
    peerDependencies:
      zod: "*"
  "@streamdown/cjk@*":
    peerDependencies:
      unified: "*"
  "@tanstack/react-router-devtools@*":
    dependencies:
      "@tanstack/router-core": "*"
      csstype: "*"
      tiny-invariant: "*"
  "remark-cjk-friendly@*":
    dependencies:
      micromark: "*"
  "remark-cjk-friendly-gfm-strikethrough@*":
    dependencies:
      micromark: "*"
